<div class="face-snap-card" [ngClass]="{ 'snapped' : userSnapped }">
    <h2> {{ faceSnap()?.title }} </h2>
    @if(faceSnap()?.location){
    <p> Localisation : {{ faceSnap()?.location }} </p>
    } @else {
    <p> Location non specifie </p>
    }
    <img [src]="faceSnap()?.imageSrc" [alt]="faceSnap()?.title" height="400" width="500" />
    <p> {{ faceSnap()?.description }} </p>
    <p> Mise en ligne {{ faceSnap()?.createdAt }} </p>
    <p>
        <button (click)="onSnap()">
            {{ snappButton() }}
        </button>
        <span [ngStyle]="{ color: 'rgb(0, ' + faceSnap()?.snaps + ', 0)' }">🤌 {{ faceSnap()?.snaps }}</span>
    </p>

</div>
